<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="1024" height="1024">
    <!-- IDE: a light editor, its files in a green column beside the code, the last row sprouting. -->
    <defs>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf1"/><stop offset="1" stop-color="#f3dcb8"/></linearGradient>
        <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ee08f"/><stop offset="1" stop-color="#3f9c50"/></linearGradient>
        <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fdc8f"/><stop offset="1" stop-color="#2f8f45"/></linearGradient>
        <linearGradient id="green-light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bdeca8"/><stop offset="1" stop-color="#58b566"/></linearGradient>
        <clipPath id="tile"><rect x="12" y="16" width="104" height="96" rx="18"/></clipPath>
    </defs>
    <rect x="12" y="16" width="104" height="96" rx="18" fill="url(#body)"/>
