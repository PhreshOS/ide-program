    <path d="M21 34h16M21 46h12M21 58h16" stroke="#eaf8e4" stroke-width="5" stroke-linecap="round"/>
    <path d="M56 36h18M80 36h22" stroke="#ef9a4a" stroke-width="6" stroke-linecap="round"/>
    <path d="M64 50h32" stroke="#3f9c50" stroke-width="6" stroke-linecap="round"/>
    <path d="M64 64h14M84 64h18" stroke="#ef9a4a" stroke-width="6" stroke-linecap="round"/>
    <path d="M56 78h20" stroke="#8fdc8f" stroke-width="6" stroke-linecap="round"/>
    <path d="M90 100V88" stroke="#3f9c50" stroke-width="4" stroke-linecap="round"/>
    <path d="M90 92c-3-7-9-9-14-5 3 6 8 8 14 5z" fill="url(#green)"/>
    <path d="M90 90c3-8 10-10 15-6-3 7-9 9-15 6z" fill="url(#green-light)"/>
    <rect x="12" y="16" width="104" height="96" rx="18" fill="none" stroke="#ecc58f" stroke-width="2.5"/>
